{{- $ids := list }}
{{- range $id, $c := .Values.devApps }}
{{- if and (or (not (hasKey $c "enabled")) (eq $c.enabled true)) (eq ($c.type | default "") "gitHelmSource") }}
{{- if not $c.repository }}
{{- fail (printf "devApps.%s: gitHelmSource requires repository" $id) }}
{{- end }}
{{- if not $c.path }}
{{- fail (printf "devApps.%s: gitHelmSource requires path" $id) }}
{{- end }}
{{- $ids = append $ids $id }}
{{- end }}
{{- end }}
{{- if gt (len $ids) 0 }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.desiredApplicationsConfigMapName | default (printf "%s-desired-applications" .Release.Name) }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: {{ .Values.partOf | quote }}
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    gitops.k8s-ui.dev/role: desired-applications
    env: {{ .Values.env | quote }}
data:
{{- range $id, $c := .Values.devApps }}
{{- if and (or (not (hasKey $c "enabled")) (eq $c.enabled true)) (eq ($c.type | default "") "gitHelmSource") }}
  {{- $fname := printf "desired-%s.application.yaml" $id }}
  {{ $fname }}: |
    name: {{ $c.applicationName | default (printf "%s-%s" $.Values.partOf $id) | quote }}
    project: {{ $c.project | default "default" | quote }}
    source:
      repoUrl: {{ $c.repository | quote }}
      path: {{ $c.path | quote }}
      targetRevision: {{ $c.ref | default $.Values.defaultRef | quote }}
    destination:
      cluster: {{ $c.cluster | default "in-cluster" | quote }}
      namespace: {{ $c.namespace | default $id | quote }}
{{- if $c.syncPolicy }}
    syncPolicy:
{{ toYaml $c.syncPolicy | nindent 6 }}
{{- else }}
    syncPolicy: {}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
