{{- /*
Embedded Applications. Each Git-sourced devApps entry produces one Application
row, bound to a project of the same name (created by
desired-projects-configmap.yaml).
*/}}
{{- $apps := list }}
{{- range $key, $cfg := .Values.devApps }}
{{- $enabled := or (not (hasKey $cfg "enabled")) (eq $cfg.enabled true) }}
{{- $isInline := eq ($cfg.inline | default false) true }}
{{- if and $enabled (not $isInline) (hasKey $cfg "source") }}
{{- $name := $cfg.name | default $key }}
{{- $dest := $cfg.destination | default dict }}
{{- $destNS := $dest.namespace | default $name }}
{{- $destCluster := $dest.cluster | default ($.Values.cluster | default "in-cluster") }}
{{- $entry := dict
    "name"        $name
    "project"     $name
    "source"      $cfg.source
    "destination" (dict "cluster" $destCluster "namespace" $destNS)
}}
{{- if hasKey $cfg "syncPolicy" }}{{- $_ := set $entry "syncPolicy" $cfg.syncPolicy }}{{- end }}
{{- if hasKey $cfg "ignoreDifferences" }}
{{- $sp := index $entry "syncPolicy" | default dict }}
{{- $_ := set $sp "ignoreDifferences" $cfg.ignoreDifferences }}
{{- $_ := set $entry "syncPolicy" $sp }}
{{- end }}
{{- $apps = append $apps $entry }}
{{- end }}
{{- end }}
{{- if $apps }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-k8s-ui-child-apps" .Release.Name | trunc 63 | trimSuffix "-" }}
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: {{ .Values.partOf | quote }}
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    k8s-ui.dev/applications: embedded
data:
  applications.yaml: |
{{ dict "applications" $apps | toYaml | nindent 4 }}
{{- end }}
