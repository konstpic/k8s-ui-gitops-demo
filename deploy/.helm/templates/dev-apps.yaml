{{- range $app, $appData := .Values.devApps }}
{{- if or (not (hasKey $appData "enabled")) (eq $appData.enabled true) }}
{{- $ref := $appData.ref | default $.Values.ref }}
{{- $repository := $appData.repository | default $.Values.repository }}
{{- if not $repository }}
{{- fail (printf "devApps.%s: set repository on the app or set top-level .Values.repository" $app) }}
{{- end }}
{{- $path := $appData.path | default "." }}
{{- $syncPolicy := $appData.syncPolicy | default $.Values.syncPolicy }}
{{- $cluster := $appData.cluster | default $.Values.cluster }}
{{- $appName := printf "%s-%s" $.Values.umbrellaRelease $app }}
{{- $namespace := $appData.namespace | default (printf "%s%s" ($.Values.namespacePrefix | default "") $app) }}
{{- $repoNoGit := $repository | trimSuffix ".git" }}
{{- $link := "" }}
{{- if hasPrefix "https://github.com" $repository }}
{{- $link = printf "%s/tree/%s" $repoNoGit $ref }}
{{- else }}
{{- $link = printf "%s/-/tree/%s" $repoNoGit $ref }}
{{- end }}
{{- if and $path (ne $path ".") }}
{{- $link = printf "%s/%s" $link (trimPrefix "/" $path) }}
{{- end }}

apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: {{ $appName }}
  labels:
    app.kubernetes.io/name: {{ $appName }}
    app.kubernetes.io/part-of: {{ $.Values.umbrellaRelease }}
    env: {{ $.Values.env | quote }}
    role: devApp
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Umbrella {{ $.Values.umbrellaRelease }} / devApp {{ $app }}
  sourceRepos:
    - {{ $repository | quote }}
  destinations:
    - name: {{ $cluster }}
      namespace: {{ $namespace }}
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  orphanedResources:
    warn: false

---

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $appName }}
  annotations:
    link.argocd.argoproj.io/external-link: {{ $link | quote }}
  labels:
    app.kubernetes.io/name: {{ $appName }}
    app.kubernetes.io/part-of: {{ $.Values.umbrellaRelease }}
    devapp: {{ $app | quote }}
    env: {{ $.Values.env | quote }}
    role: devApp
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ $appName }}
  destination:
    name: {{ $cluster }}
    namespace: {{ $namespace }}
  source:
    repoURL: {{ $repository | quote }}
    targetRevision: {{ $ref | quote }}
    path: {{ $path | quote }}
  syncPolicy:
    {{- if eq $syncPolicy "auto" }}
    automated:
      prune: true
      selfHeal: true
    {{- end }}
    syncOptions:
      - CreateNamespace=true
      - FailOnSharedResource=true

---

{{- end }}
{{- end }}
