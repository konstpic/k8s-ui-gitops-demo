# Label app.kubernetes.io/part-of for all generated objects.
partOf: gitops-demo

env: dev

# Optional prefix for namespace: "<namespacePrefix><appKey>". Empty = namespace is the app key only.
namespacePrefix: ""

# devApps: map key = stable id (used as default namespace and in resource names).
# type: httpEcho — Deployment + Service (hashicorp/http-echo by default).
# For plain YAML or a standalone Helm chart in this repo, create a separate k8s-ui Application
# (e.g. path "kubernetes" or "samples/hello-world") instead of listing it here.
devApps:
  hello-world:
    type: httpEcho
    message: "Hello World"
    image:
      repository: hashicorp/http-echo
      tag: "0.2.3"
    servicePort: 80
    containerPort: 5678
    resources:
      requests:
        cpu: 5m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 32Mi

  # Example second service (enable when needed):
  # echo-canary:
  #   type: httpEcho
  #   enabled: true
  #   message: "Canary"
  #   namespace: echo-canary
