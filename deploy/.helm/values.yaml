# Label app.kubernetes.io/part-of for generated objects.
partOf: gitops-demo

env: dev

# Optional prefix for httpEcho namespace: "<namespacePrefix><appKey>".
namespacePrefix: ""

# devApps — map key = stable id. Only type httpEcho is supported here.
# Declarative multi-repo apps live in k8s-ui/apps.yaml (Application catalog).
devApps:
  hello-echo:
    type: httpEcho
    message: "Hello World"
    image:
      repository: hashicorp/http-echo
      tag: "0.2.3"
    servicePort: 80
    containerPort: 5678
    resources:
      requests:
        cpu: 5m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 32Mi
