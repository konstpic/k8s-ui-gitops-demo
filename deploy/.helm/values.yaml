# Common label.
partOf: gitops-demo
env: dev

# Optional cluster-wide default destination.
cluster: in-cluster

# Optional prefix for httpEcho namespace (inline workloads only).
namespacePrefix: ""

# ─────────────────────────────────────────────────────────────────────────────
# devApps — single map. Each key is the canonical app id.
#
# Each Git-sourced entry produces:
#   1. k8s-ui.io/v1alpha1 AppProject (same name as the app)
#   2. k8s-ui.io/v1alpha1 Application (same name) bound to that project
#   3. Namespace + ServiceAccount in the destination namespace (workloads.yaml)
#
# The controller materialises the AppProject and Application rows automatically
# on every reconcile (app-of-apps pattern — no flag needed).
#
# Required when the entry IS a Git-sourced Application:
#   source.repoUrl
#   source.path             (default ".")
#   source.targetRevision   (default "HEAD")
#   destination.namespace
#   destination.cluster     (default top-level .cluster, or "in-cluster")
#
# Inline workloads:
#   set inline: true and provide image / message / containerPort fields.
#   These render a Namespace + Deployment + Service in this chart directly.
#   Inline entries do NOT produce AppProject or Application child objects.
#
# Optional per-entry overrides:
#   syncPolicy:           same shape as k8s-ui /api/v1/applications body
#   ignoreDifferences:    list of {group,kind,name?,namespace?,jsonPointers[]}
# ─────────────────────────────────────────────────────────────────────────────
devApps:

  # ── Git-sourced applications ─────────────────────────────────────────────
  web:
    source:
      repoUrl: https://github.com/konstpic/k8s-ui-gitops-demo.git
      path: kubernetes
      targetRevision: main
    destination:
      namespace: gitops-demo
    syncPolicy:
      automated:
        prune: false  
        selfHeal: false
      createNamespace: true

  hello-world:
    source:
      repoUrl: https://github.com/konstpic/k8s-ui-gitops-demo.git
      path: samples/hello-world
      targetRevision: main
    destination:
      namespace: hello-world
    syncPolicy:
      automated:
        prune: false
        selfHeal: false
      createNamespace: true

  # ── Inline workload (rendered directly by this chart) ────────────────────
  hello-echo:
    inline: true
    message: "Hello World"
    image:
      repository: hashicorp/http-echo
      tag: "0.2.3"
    servicePort: 80
    containerPort: 5678
    resources:
      requests:
        cpu: 5m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 32Mi
