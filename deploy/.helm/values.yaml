# Common label.
partOf: gitops-demo
env: dev

# Optional cluster-wide default destination.
cluster: in-cluster

# Optional prefix for httpEcho namespace (inline workloads only).
namespacePrefix: ""

# ─────────────────────────────────────────────────────────────────────────────
# devApps — single map. Each key is the canonical app id.
#
# Each entry produces a synchronised triple in k8s-ui:
#   1. AppProject (same name as the app) with per-app policy
#   2. Application (same name) bound to that project
#   3. ServiceAccount (same name) in the destination namespace
#
# Required when the entry IS an Application (Git-sourced):
#   source.repoUrl
#   source.path             (default ".")
#   source.targetRevision   (default "HEAD")
#   destination.namespace
#   destination.cluster     (default top-level .cluster, or "in-cluster")
#
# Inline workloads:
#   set inline: true and provide image / message / containerPort fields.
#   These render a Namespace + Deployment + Service in this chart directly.
#
# Optional per-entry overrides:
#   project.sourceRepos              extra allowed repos (defaults to source.repoUrl)
#   project.clusterResourceWhitelist defaults to Namespace + RBAC + PV
#   project.namespaceResourceBlacklist
#   project.clusterWide:  true → adds {*,*} to destinations and resources
#   syncPolicy:           same shape as k8s-ui /api/v1/applications body
#   ignoreDifferences:    list of {group,kind,name?,namespace?,jsonPointers[]}
# ─────────────────────────────────────────────────────────────────────────────
devApps:

  # ── Git-sourced applications ─────────────────────────────────────────────
  web:
    source:
      repoUrl: https://github.com/konstpic/k8s-ui-gitops-demo.git
      path: kubernetes
      targetRevision: main
    destination:
      namespace: gitops-demo
    syncPolicy:
      automated:
        prune: true
        selfHeal: true
      createNamespace: true

  hello-world:
    source:
      repoUrl: https://github.com/konstpic/k8s-ui-gitops-demo.git
      path: samples/hello-world
      targetRevision: main
    destination:
      namespace: hello-world
    syncPolicy:
      automated:
        prune: true
        selfHeal: true
      createNamespace: true

  # ── Inline workload (rendered directly by this chart) ────────────────────
