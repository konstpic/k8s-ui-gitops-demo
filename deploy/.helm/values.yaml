# Umbrella release id — prefix for Argo CD Application / AppProject names (must be unique in cluster).
umbrellaRelease: gitops-demo

env: dev

# Optional prefix for generated namespace: "<namespacePrefix><appKey>". Empty = namespace equals app key only.
namespacePrefix: ""

# Default Git revision if a devApp omits `ref`.
ref: main

# Default repo if a devApp omits `repository` (override per app).
repository: ""

syncPolicy: manual

# Argo CD destination cluster name (as registered in Argo CD).
cluster: in-cluster

# --- Example devApps: replace repo URLs with yours (product / service / this repo).
# Namespace defaults to the map key (app name), e.g. key `demo-web` -> namespace `demo-web`.
# Override any app with `namespace: custom-ns`.
devApps:
  demo-web:
    repository: https://github.com/example/k8s-ui-gitops-demo.git
    path: kubernetes
    ref: main
    syncPolicy: auto

  # Helm chart under samples/ — Argo CD detects Chart.yaml and deploys as Helm.
  hello-world:
    repository: https://github.com/example/k8s-ui-gitops-demo.git
    path: samples/hello-world
    ref: main
    syncPolicy: auto

  # product (paths like stable/... in deploy/product monorepo):
  # product-db:
  #   repository: https://git.example.com/deploy/product.git
  #   path: stable/base/postgres-gateway
  #   ref: master
  #
  # service (separate repo with per-product dirs — point path at the chart/manifests root):
  # mrkt-api:
  #   repository: https://git.example.com/deploy/service.git
  #   path: mrkt/api
  #   ref: master
